name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/package-lock.json
      - name: Install tools
        working-directory: tools
        run: npm install
      - name: Validate schemas and conformance fixtures
        working-directory: tools
        run: npm run validate
